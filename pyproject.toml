[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "q-selector"
version = "1.0.0"
description = "Machine-learning-based quantum processor selection for OpenQASM circuits"
readme = "README.md"
authors = [
    { name = "Q-Selector Contributors" },
]
keywords = ["quantum computing", "machine learning", "backend selection", "qasm", "device selection"]
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "qiskit>=2.3,<3",
    "matplotlib>=3.8,<4",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
data = [
    "qiskit-aer>=0.17,<0.18",
    "qiskit-ibm-runtime>=0.40,<0.46",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]
docs = [
    "sphinx>=7,<9",
    "furo>=2024.8.6",
    "myst-parser>=3,<5",
    "sphinx-copybutton>=0.5,<1",
    "sphinx-design>=0.6,<1",
]

[project.scripts]
q-selector = "src.recommend:main"

[project.urls]
Homepage = "https://github.com/mobaize/Q-selector"
Repository = "https://github.com/mobaize/Q-selector"
Issues = "https://github.com/mobaize/Q-selector/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--showlocals"]
log_level = "INFO"
filterwarnings = [
    'error',
    'ignore:.*qiskit.*:DeprecationWarning:',
]

[tool.coverage]
run.source = ["src"]
report.exclude_also = [
    '\.\.\.',
    'if TYPE_CHECKING:',
    'raise AssertionError',
    'raise NotImplementedError',
]
show_missing = true
skip_empty = true
precision = 1

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
