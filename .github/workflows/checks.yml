name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,data,docs]"
      - run: python -m ruff check src tests docs/conf.py
      - run: python -m ruff format --check src tests docs/conf.py
      - run: python -m pytest
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
